name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: site
      # The identities repo at main, sibling to the site so the build's
      # relative sibling resolution ("../uiforagents") holds in CI.
      - uses: actions/checkout@v6
        with:
          repository: peteretelej/uiforagents
          ref: main
          path: uiforagents
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # The site build runs the identities repo's example app (the /demo/
      # bundle), so its dependencies must be installed first.
      - run: npm ci
        working-directory: uiforagents
      - run: npm run build
        working-directory: site
      # Assets-only Worker deploy (wrangler.jsonc: assets.directory = dist).
      # UAF_DEPLOY_TOKEN must be an app-scoped Cloudflare API token: account
      # "Workers" permission group with Editor access, this account only.
      # It should never be a broadly privileged token.
      - name: deploy to workers
        working-directory: site
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UAF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UAF_CLOUDFLARE_ACCOUNT_ID }}
